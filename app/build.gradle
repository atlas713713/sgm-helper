plugins {
    id "com.android.application"
}

android {
    namespace = "com.local.sgmhelper"
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.local.sgmhelper"
        minSdk = 24
        targetSdk = 36
        versionCode = 244
        versionName = "0.1.243"

        ndk {
            abiFilters "arm64-v8a"
        }
