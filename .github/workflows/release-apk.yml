name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          SGM_DEBUG_KEYSTORE_BASE64: ${{ secrets.SGM_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "${SGM_DEBUG_KEYSTORE_BASE64}"
          mkdir -p "${HOME}/.android"
          printf '%s' "${SGM_DEBUG_KEYSTORE_BASE64}" \
            | base64 --decode > "${HOME}/.android/debug.keystore"

      - name: Build APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Prepare release
        id: release
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle)
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${tag}" >&2
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "sgm-helper-${tag}.apk"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "apk=sgm-helper-${tag}.apk" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}"
          "${{ steps.release.outputs.apk }}"
          --target "${GITHUB_SHA}"
          --title "SGM Helper ${{ steps.release.outputs.tag }}"
          --generate-notes
